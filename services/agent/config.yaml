rag:
  base_url: http://localhost:8000   # the rag service (its /search)
  timeout: 10.0   # seconds per request
  retries: 2      # connection failures only; safe, /search is read-only

tickets:
  url: http://localhost:8002/mcp    # the tickets service's MCP endpoint, as docker-compose publishes it
  timeout: 10.0   # seconds per call
  retries: 2      # connection failures only; safe, the service deduplicates a repeated create

llm:              # the triage model
  base_url: http://localhost:11434/v1   # Ollama's OpenAI-compatible API
  model: qwen3.5:27b
  reasoning_effort: "none"   # thinking off: much faster; low / medium / high turn it back on, null = the server's default
  temperature: 0.0
  seed: 7          # with temperature 0: the same window gets the same answers
  timeout: 120.0   # seconds per model call
  max_retries: 2   # connection failures only (server down, refused), not 5xx

triage:           # the budgets of one window
  max_llm_calls: 8     # model calls; past it, the window is unresolved
  max_searches: 3      # search_runbooks calls
  max_log_queries: 2   # log_context calls
  hits_per_search: 3   # passages per search

logs:
  path: ../../data/logs/site.log   # relative to services/agent/; written by scripts/generate_logs.py

api:              # the agent's own HTTP API (api.py): POST /triage, GET /triage/{run_id}, GET /windows
  host: 127.0.0.1
  port: 8001
