embedding:
  base_url: http://localhost:11434/v1 # Ollama's OpenAI-compatible API 
  model: bge-m3
  dimension: 1024
  batch_size: 32

llm:
  base_url: http://localhost:11434/v1   # Ollama's OpenAI-compatible API 
  model: qwen3.5:27b
  reasoning_effort: "none"   # thinking off: ~10x faster answers; low / medium / high turn it back on

chunking:
  max_length: 1000

retrieval:
  top_k: 5   # chunks retrieved (and given to the LLM) when a request sends no top_k

vector_store:
  url: http://localhost:6333
