[project]                                        # package metadata (PEP 621)
name = "siteops-common"                          # install name; import name is siteops_common
version = "0.1.0"                                # package version
description = "Shared wire contracts (pydantic models) exchanged between services. No logic."  # one-line summary
requires-python = ">=3.12"                       # minimum Python version
dependencies = [                                 # installed wherever this package is installed
    "pydantic>=2",                               # the only dependency allowed here (D-020)
]

[build-system]                                   # how to build this package into a wheel
requires = ["hatchling"]                         # build tool fetched at build time
build-backend = "hatchling.build"                # entry point uv/pip call to build
