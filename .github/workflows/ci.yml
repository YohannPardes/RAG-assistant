name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-python: true
      - name: Install Python
        run: uv python install
      - name: Install workspace
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-python: true
      - name: Install Python
        run: uv python install
      - name: Install workspace
        run: uv sync --locked
      - name: Pytest (fast tier)
        run: uv run pytest

  integration:
    runs-on: ubuntu-latest
    services:
      qdrant:                              # Qdrant tests use it; tests needing Ollama skip themselves here
        image: qdrant/qdrant:v1.20.0       # same version as qdrant-client
        ports:
          - 6333:6333
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-python: true
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Python
        run: uv python install
      - name: Install workspace with all extras
        run: uv sync --locked --all-extras
      - name: Mypy                         # needs the extras so it can see Docling's types
        run: uv run mypy
      - name: Pytest (integration tier)
        run: uv run pytest -m integration