test:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4              # 1. get the code

    - uses: astral-sh/setup-uv@v6            # 2. get uv (check README for current major)
      with:
        enable-cache: true

    - run: uv python install                 # 3. get Python 3.12

    - run: uv sync --locked                  # 4. install the workspace

    - run: uv run pytest                     # 5. the actual check

lint:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4              # 1. get the code

